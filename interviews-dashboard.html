    .header p { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .sync-badge { font-size: 12px; color: var(--muted); background: var(--bg); padding: 6px 12px; border-radius: 6px; }
    .notion-btn { font-size: 13px; font-weight: 500; color: var(--text); background: rgba(0,0,0,.05); border: 1px solid rgba(0,0,0,.12); padding: 7px 14px; border-radius: 8px; text-decoration: none; transition: background .15s; }

    .banner a { color: #1D4ED8; font-weight: 600; text-decoration: none; }

    /* TABS */
    .tabs { background: var(--bg); padding: 0 32px; display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab { font-size: 12.5px; font-weight: 600; padding: 11px 16px; color: var(--muted); cursor: pointer; border-bottom: 2.5px solid transparent; transition: all .15s; white-space: nowrap; letter-spacing: .3px; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--cc, var(--text)); border-bottom-color: var(--cc, var(--text)); }

    /* TOOLBAR */
    .toolbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 13px 32px; display: flex; justify-content: space-between; align-items: center; }
    .client-info { display: flex; align-items: center; gap: 8px; }
    .cdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .clabel { font-size: 14px; font-weight: 700; letter-spacing: .3px; }
    .ccount { font-size: 12px; color: var(--muted); background: var(--bg); padding: 3px 10px; border-radius: 20px; }
    .view-toggle { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; gap: 2px; }
    .vbtn { font-size: 13px; font-weight: 500; padding: 5px 14px; border-radius: 6px; cursor: pointer; border: none; background: none; color: var(--muted); transition: all .15s; }
    .vbtn.active { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .toolbar-right { display: flex; align-items: center; gap: 10px; }
    .pending-btn { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 6px; cursor: pointer; border: 1.5px solid #D97706; background: #FEF3C7; color: #92400E; transition: all .15s; }
    .pending-btn.off { background: var(--bg); border-color: var(--border); color: var(--muted); }

    /* MAIN */
    .main { padding: 24px 32px; }

    /* KANBAN */
    .kanban { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 20px; }
    .kcol { flex: 0 0 272px; background: #EEECE8; border-radius: 12px; padding: 14px; }
    .kcol-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .kcol-title { font-size: 11.5px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; color: #374151; }
    .kcdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .kccount { font-size: 12px; font-weight: 600; color: var(--muted); background: rgba(0,0,0,.06); padding: 2px 8px; border-radius: 20px; }

    /* CARD */
    .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); transition: box-shadow .15s, transform .1s; }
    .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); transform: translateY(-1px); }
    .card-outlet { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .card-outlet a { color: inherit; text-decoration: none; }
    .card-outlet a:hover { text-decoration: underline; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .tag { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 4px; }
    .tag-date  { background: #F3F4F6; color: #374151; }
    .tag-loc   { background: #EEF2FF; color: #4338CA; }
    .tag-type  { background: #FDF4FF; color: #7E22CE; }
    .tag-tier1 { background: #EFF6FF; color: #1D4ED8; }
    .tag-tier2 { background: #F5F3FF; color: #6D28D9; }
    .tag-tier3 { background: #F9FAFB; color: #6B7280; }
    .tag-top   { background: #FFF1F2; color: #BE123C; }
    .tag-med   { background: #FFFBEB; color: #92400E; }
    .card-people { font-size: 12px; color: #374151; margin-top: 7px; }
    .card-notes { font-size: 12px; color: var(--muted); margin-top: 7px; line-height: 1.45; }

    /* STATUS BADGE */
    .sbadge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 5px; }
    .sbadge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    /* TABLE */
    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); background: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 11px 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); background: #FAFAF8; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #FAFAF8; }
    td.outlet { font-weight: 600; }
    td.outlet a { color: inherit; text-decoration: none; }
    td.outlet a:hover { text-decoration: underline; }
    td.notes-cell { font-size: 12px; color: var(--muted); max-width: 240px; }

    /* SUB LABEL */
    .sub-label { font-size: 11.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin: 24px 0 10px; }
    .sub-label:first-child { margin-top: 0; }

    /* EMPTY */

    .empty p { font-size: 13.5px; }
    .empty a { color: #1D4ED8; }

    @media (max-width: 700px) {

      .tabs { padding: 0 16px; }
      .header { flex-wrap: wrap; gap: 10px; }
      .header-right { width: 100%; }
    }
  </style>

  _isAll: true,
  sections:[{ label:"All", type:"all", rows:[] }]
};
// Tag every row with its parent client color + name for the all-clients view.
CLIENTS.forEach(c => c.sections.forEach(s => s.rows.forEach(r => {
  r._clientColor = c.color;
  r._clientName  = c.name;
})));

// ── KANBAN COLUMN DEFINITIONS ──────────────────────────────────
const KCOLS = [
  { g:0, label:"Gathering Info",      dot:"#D97706" },
  { g:1, label:"In Progress",         dot:"#2563EB" },
  { g:2, label:"Booked / Scheduled",  dot:"#16A34A" },
  { g:3, label:"Pending Publication", dot:"#CA8A04" },
  { g:4, label:"Published / Done",    dot:"#6B7280" },
  { g:5, label:"Declined / Archived", dot:"#DC2626" },
];

// ── STATE ──────────────────────────────────────────────────────

function curClient(){ return ALL_CLIENTS[ai]; }

// ── HELPERS ────────────────────────────────────────────────────
// g:4 = Published/Done, g:5 = Declined/Archived/Passed — always hidden
const HIDDEN_GROUPS = new Set([4, 5]);
function allRows(c){
  return c.sections.flatMap(s=>s.rows).filter(r=>{
    if(HIDDEN_GROUPS.has(gs(r.status).g)) return false;
    if(!showPending && gs(r.status).g === 3) return false;
    return true;
  });
}
function clientBadge(r){
  if(!r._clientColor) return "";
  return `<span style="font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:3px;background:${r._clientColor}22;color:${r._clientColor};margin-right:4px">${r._clientName}</span>`;
}
function fmtDate(d){
  if(!d) return "";
  const m = d.match(/^(\d{4})-(\d{2})$/);
  if(m){ const dt=new Date(d+"-01"); return dt.toLocaleDateString("en-US",{month:"short",year:"numeric"}); }
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}

// ── CARD ───────────────────────────────────────────────────────
function card(r){
  const dt = fmtDate(r.date);
  const dateTag  = dt ? `<span class="tag tag-date">📅 ${dt}${r.time?" · "+r.time:""}</span>` : (r.time?`<span class="tag tag-date">🕐 ${r.time}</span>`:"");
  const locTag   = r.location ? `<span class="tag tag-loc">📍 ${r.location}</span>` : "";
  const typeArr  = r.type ? (Array.isArray(r.type)?r.type:[r.type]) : [];
  const typeTags = typeArr.map(t=>`<span class="tag tag-type">${t}</span>`).join("");
  const priTag   = r.priority==="Top-Tier"?`<span class="tag tag-top">★ Top-Tier</span>`
                 : r.priority==="Medium"?`<span class="tag tag-med">Med</span>`:"";
  const tierTag  = r.tier==="Tier 1"?`<span class="tag tag-tier1">Tier 1</span>`
                 : r.tier==="Tier 2"?`<span class="tag tag-tier2">Tier 2</span>`
                 : r.tier==="Tier 3"?`<span class="tag tag-tier3">Tier 3</span>`:"";

  const ppl = [
    r.interviewees,
    Array.isArray(r.interviewee)?r.interviewee.join(", "):r.interviewee,
    r.reporter, r.spokesperson, r.journalist, r.speaker
  ].filter(Boolean);
  const peopleHtml = ppl.length ? `<div class="card-people">👤 ${ppl.join(" · ")}</div>` : "";

  const notesTxt = r.notes||r.details||r.nextStep||"";
  const notesHtml = notesTxt ? `<div class="card-notes">${notesTxt}</div>` : "";

  const outletHtml = r.url
    ? `<div class="card-outlet"><a href="${r.url}" target="_blank">${r.outlet} ↗</a></div>`
    : `<div class="card-outlet">${r.outlet}</div>`;

  const cam = r.campaign ? r.campaign.join(", ") : "";
  const camTag = cam ? `<span class="tag tag-date">${cam}</span>` : "";

  return `<div class="card">
    ${outletHtml}
    ${clientBadge(r)}${badge(r.status)}
    <div class="card-meta">${dateTag}${locTag}${typeTags}${priTag}${tierTag}${camTag}</div>
    ${peopleHtml}
    ${notesHtml}
  </div>`;
}

// ── KANBAN ─────────────────────────────────────────────────────
function renderKanban(){
  const rows = allRows(curClient());
  if(!rows.length) return emptyState();
  const grouped={};
  rows.forEach(r=>{ const g=gs(r.status).g; (grouped[g]=grouped[g]||[]).push(r); });
  const cols = KCOLS.filter(k=>grouped[k.g]?.length);
  if(!cols.length) return emptyState();
  return `<div class="kanban">`+cols.map(k=>{
    const cr=grouped[k.g];
    return `<div class="kcol">
      <div class="kcol-head">
        <div class="kcol-title"><div class="kcdot" style="background:${k.dot}"></div>${k.label}</div>
        <span class="kccount">${cr.length}</span>
      </div>
      ${cr.map(card).join("")}
    </div>`;
  }).join("")+`</div>`;
}

// ── TABLE ROUTER ───────────────────────────────────────────────
function renderTable(){
  const c=curClient(), rows=allRows(c);
  if(c.id==="all")        return tAll(rows);
  if(c.id==="flyover")    return tFlyover();
  if(c.id==="efm")        return rows.length?tEFM(rows):emptyState();
  if(c.id==="codeninjas") return rows.length?tCN(rows):emptyState();
  if(c.id==="letgrow")    return rows.length?tLG(rows):emptyState();
  if(c.id==="jivepr")     return tJP(rows);
  return emptyState();
}
